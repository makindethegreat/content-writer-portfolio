<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
<title id="title">Layered green and peach circles</title>
<desc id="desc">Six overlapping translucent circles transition from deep forest green through muted olive into warm peach on a textured ivory background.</desc>
<defs>
  <radialGradient id="paper" cx="48%" cy="46%" r="80%">
    <stop offset="0" stop-color="#F7F0E2"/>
    <stop offset="1" stop-color="#F0E7D6"/>
  </radialGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
  </filter>
  <filter id="softEdge" x="-8%" y="-8%" width="116%" height="116%">
    <feGaussianBlur stdDeviation=".35"/>
  </filter>
</defs>
<rect width="1672" height="941" fill="url(#paper)"/>
<g filter="url(#softEdge)">
  <circle cx="508" cy="455" r="148" fill="#09271F"/>
  <circle cx="632" cy="455" r="148" fill="#657461" fill-opacity=".78"/>
  <circle cx="756" cy="455" r="148" fill="#97886C" fill-opacity=".66"/>
  <circle cx="880" cy="455" r="148" fill="#D78F68" fill-opacity=".58"/>
  <circle cx="1004" cy="455" r="148" fill="#E7A47E" fill-opacity=".54"/>
  <circle cx="1128" cy="455" r="148" fill="#F0B995" fill-opacity=".48"/>
</g>
<rect width="1672" height="941" filter="url(#grain)" opacity=".42"/>
</svg>