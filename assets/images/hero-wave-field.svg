<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Soft right-side dotted field</title>
  <desc id="desc">A single field of fine dotted concentric curves fades softly into the dark background from the right edge.</desc>
  <defs>
    <linearGradient id="dotTone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3EFE0" stop-opacity="0.12"/>
      <stop offset="0.42" stop-color="#E7DFCE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F3EFE0" stop-opacity="0.52"/>
    </linearGradient>
    <clipPath id="rightField">
      <rect x="580" y="0" width="520" height="800"/>
    </clipPath>
    <radialGradient id="rightFieldFade" cx="1030" cy="400" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.68"/>
      <stop offset="0.48" stop-color="white" stop-opacity="0.43"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="rightFieldMask" maskUnits="userSpaceOnUse" x="580" y="0" width="520" height="800">
      <rect x="580" y="0" width="520" height="800" fill="url(#rightFieldFade)"/>
    </mask>
  </defs>
  <g stroke="url(#dotTone)" stroke-width="1.65" stroke-linecap="round"
     stroke-dasharray="0.12 10.4" opacity="0.72"
     clip-path="url(#rightField)" mask="url(#rightFieldMask)">
