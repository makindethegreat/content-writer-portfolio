<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#F3EFE0" />
  <title>404 — Page not found | Vevnit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #F3EFE0;
      --dune: #E7DFCE;
      --clay: #C95F3C;
      --olive: #4B5B4A;
      --charcoal: #1F2224;
      --muted: #69675F;
      --line: rgba(31,34,36,.22);
    }
    *,*::before,*::after{box-sizing:border-box}
    html{min-height:100%;background:var(--sand)}
    body{margin:0;min-height:100vh;background:var(--sand);color:var(--charcoal);font-family:'Jost',sans-serif;-webkit-font-smoothing:antialiased}
    .error-shell{min-height:100vh;max-width:1440px;margin:0 auto;padding:clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
    .topline{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
    .wordmark{font-size:1.65rem;line-height:1;font-weight:700;letter-spacing:-.075em;text-decoration:none;color:var(--charcoal)}
    .wordmark span{color:var(--clay)}
    .top-note,.coordinates,.eyebrow,.route-label{font-size:.67rem;font-weight:600;letter-spacing:.17em;text-transform:uppercase}
    .top-note{color:var(--muted)}
    .main-layout{display:grid;grid-template-columns:minmax(0,.95fr) minmax(380px,1.05fr);gap:clamp(28px,5vw,80px);align-items:center;padding:clamp(56px,9vh,112px) 0}
    .copy{position:relative;z-index:2;max-width:620px}
    .eyebrow{display:flex;align-items:center;gap:12px;color:var(--olive);margin:0 0 22px}
    .eyebrow:before{content:"";width:28px;height:1px;background:var(--clay)}
    .error-code{font-size:clamp(6.8rem,15vw,13.5rem);font-weight:700;letter-spacing:-.105em;line-height:.78;margin:0 0 30px;position:relative;width:max-content;color:var(--charcoal);isolation:isolate}
    .error-code:before,.error-code:after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;clip-path:inset(0 0 0 0)}
    .error-code:before{color:var(--clay);transform:translate(3px,-1px);opacity:.75;clip-path:inset(12% 0 68% 0);animation:glitch-a 4.8s infinite steps(1,end)}
    .error-code:after{color:var(--olive);transform:translate(-3px,1px);opacity:.7;clip-path:inset(70% 0 12% 0);animation:glitch-b 5.6s infinite steps(1,end)}
    @keyframes glitch-a{0%,91%,94%,100%{transform:translate(0)}92%{transform:translate(5px,-2px)}93%{transform:translate(-3px,1px)}}
    @keyframes glitch-b{0%,87%,90%,100%{transform:translate(0)}88%{transform:translate(-5px,2px)}89%{transform:translate(3px,-1px)}}
    .error-caption{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);font-weight:700;margin:0 0 15px}
    h1{font-size:clamp(2.35rem,5vw,4.6rem);font-weight:400;letter-spacing:-.055em;line-height:1.06;margin:0;max-width:650px}
    h1 em{font-style:normal;color:var(--clay)}
    .support-copy{max-width:420px;color:var(--muted);font-size:1rem;line-height:1.7;margin:22px 0 32px}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    .action{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--charcoal);color:var(--charcoal);text-decoration:none;text-transform:uppercase;font-size:.7rem;font-weight:600;letter-spacing:.12em;transition:background .2s,color .2s,border-color .2s}
    .action.primary{background:var(--charcoal);color:var(--sand)}
    .action:hover{background:var(--clay);border-color:var(--clay);color:#fff}
    .action:focus-visible{outline:3px solid var(--clay);outline-offset:4px}
    .map-panel{position:relative;min-height:490px;display:flex;align-items:center;justify-content:center}
    .map-frame{width:100%;max-width:650px;aspect-ratio:1.13;position:relative;border:1px solid var(--line);background:rgba(231,223,206,.48);overflow:hidden}
    .map-frame:before,.map-frame:after{content:"";position:absolute;pointer-events:none;background:var(--line)}
    .map-frame:before{width:1px;height:100%;left:50%}
    .map-frame:after{height:1px;width:100%;top:50%}
    .map-svg{position:absolute;inset:0;width:100%;height:100%}
    .map-grid{stroke:rgba(31,34,36,.09);stroke-width:1;fill:none}
    .maze-route{fill:none;stroke:var(--olive);stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:7 7;animation:route-drift 22s linear infinite}
    .maze-wall{fill:none;stroke:var(--charcoal);stroke-width:5;stroke-linecap:square;stroke-linejoin:miter}
    .maze-accent{fill:none;stroke:var(--clay);stroke-width:2.5}
    .map-node{fill:var(--sand);stroke:var(--clay);stroke-width:2}
    .map-dot{fill:var(--olive)}
    .map-index{font:600 10px 'Jost',sans-serif;letter-spacing:1px;fill:var(--muted)}
    .map-stamp{position:absolute;right:18px;top:16px;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    .map-coord{position:absolute;left:18px;bottom:16px;font-size:.62rem;letter-spacing:.12em;color:var(--muted)}
    .map-blocked{position:absolute;right:18%;bottom:20%;padding:7px 10px;background:var(--clay);color:var(--sand);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase}
    @keyframes route-drift{to{stroke-dashoffset:-140}}
    .bottomline{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:.68rem;letter-spacing:.08em}
    .bottomline strong{font-weight:600;color:var(--charcoal)}
    @media(max-width:850px){
      .error-shell{padding:26px 22px}
      .main-layout{grid-template-columns:1fr;gap:24px;padding:68px 0 48px}
      .copy{max-width:680px}
      .map-panel{min-height:0}
      .map-frame{max-width:580px;aspect-ratio:1.2}
      .error-code{font-size:clamp(7rem,23vw,11rem)}
    }
    @media(max-width:480px){
      .top-note{font-size:.55rem;letter-spacing:.1em}
      .main-layout{padding-top:58px}
      h1{font-size:clamp(2.35rem,10vw,3.2rem)}
      .support-copy{font-size:.94rem}
      .actions{display:grid;grid-template-columns:1fr 1fr}
      .action{padding:0 10px;font-size:.62rem}
      .map-frame{aspect-ratio:.98}
      .map-panel{margin:0 -5px}
      .bottomline{align-items:flex-start;flex-direction:column;gap:6px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
    }
  </style>

</head>

            <path class="maze-wall" d="M58 76H250V142H132V224H330V92H520V188H430V270H560V454H382V382H270V470H92V360H180V302H58V76Z" />

            <path class="maze-route" d="M24 270H92V302H180V224H132V142H250V76H390V92H520V188H430V270H350V330H470V382H382V454H270V470H92V440" />
            <path class="maze-accent" d="M24 270H54M566 454H596" />

    </section>

    <footer class="bottomline">

</html>
